name: Daily Access Report

on:
  schedule:
    # Executa todo dia às 18h (horário UTC, ajuste conforme necessário)
    - cron: '0 21 * * *'  # 21:00 UTC = 18:00 BRT
  workflow_dispatch:  # Permite execução manual

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pandas supabase pytz sendgrid
      
      - name: Generate and send report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          # Nota: Script de relatório diário precisa ser atualizado para usar Supabase
          # python scripts/send_daily_report.py
          echo "Script de relatório diário precisa ser atualizado para usar Supabase"
